[pytest]
minversion = 8.4
testpaths = tests
addopts = --strict-config --strict-markers
markers =
    smoke: quick checks of agreed critical workflows
    e2e: functional end-to-end UI workflows
    api_assisted: verified API-assisted setup or outcome validation
    visual: visual regression comparisons with reviewed baselines
    costly: cloud operations requiring a separately implemented explicit opt-in gate
